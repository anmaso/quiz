<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  // Apply the theme before first paint to avoid a flash.
  (function () {
    var t = null;
    try { t = localStorage.getItem('quiz-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  :root {
    --bg: #f8fafc;
    --panel: #ffffff;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #0f172a;
    --muted: #64748b;
    --accent: #4f46e5;
    --accent-soft: rgba(79, 70, 229, .10);
    --accent-text: #ffffff;
    --ok: #16a34a;
    --ok-bg: #dcfce7;
    --bad: #dc2626;
    --bad-bg: #fee2e2;
    --code-bg: #f1f5f9;
    --shadow: 0 1px 3px rgba(15, 23, 42, .08), 0 4px 16px rgba(15, 23, 42, .04);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0f1117;
    --panel: #151a24;
    --card: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #6366f1;
    --accent-soft: rgba(99, 102, 241, .16);
    --accent-text: #ffffff;
    --ok: #22c55e;
    --ok-bg: rgba(34, 197, 94, .13);
    --bad: #ef4444;
    --bad-bg: rgba(239, 68, 68, .13);
    --code-bg: #0b1220;
    --shadow: none;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }
  a { color: var(--accent); }
  code, kbd, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .9em; }
  code, kbd { background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px; padding: .05em .35em; }
  pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; overflow-x: auto; text-align: left; }
  pre code { background: none; border: 0; padding: 0; }
  table { border-collapse: collapse; }
  th, td { border: 1px solid var(--border); padding: 4px 8px; }
  button { font: inherit; color: inherit; }

  /* Top bar */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 700; color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 8px; }
  .brand-mark { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: var(--accent-text); font-size: 14px; }
  .topbar .spacer { flex: 1; }
  .icon-btn {
    display: inline-grid; place-items: center;
    width: 36px; height: 36px; border-radius: 8px;
    border: 1px solid var(--border); background: transparent; cursor: pointer;
  }
  .icon-btn:hover { background: var(--accent-soft); }
  .icon-btn svg { width: 18px; height: 18px; }

  /* Generic */
  .wrap { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 24px; box-shadow: var(--shadow);
  }
  .card + .card { margin-top: 20px; }
  .muted { color: var(--muted); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 18px; border-radius: 9px; border: 1px solid var(--border);
    background: transparent; cursor: pointer; text-decoration: none; color: var(--text); font-weight: 600;
  }
  .btn:hover:not(:disabled) { background: var(--accent-soft); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  h1 { font-size: 1.7rem; line-height: 1.25; margin: 0 0 8px; }
  h2 { font-size: 1.15rem; margin: 0 0 12px; }

  /* Home */
  .load-form { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .load-form input {
    flex: 1 1 320px; min-width: 0;
    padding: 11px 14px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font: inherit;
  }
  .load-form input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .home ul { padding-left: 20px; }
  .home li { margin: 4px 0; }

  /* Quiz layout */
  .layout { display: flex; align-items: flex-start; max-width: 1200px; margin: 0 auto; }
  .sidebar {
    width: 240px; flex-shrink: 0;
    position: sticky; top: 57px; max-height: calc(100vh - 57px); overflow-y: auto;
    padding: 20px 12px; border-right: 1px solid var(--border);
  }
  .score-badge {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; margin-bottom: 14px; border-radius: 10px;
    background: var(--accent-soft); font-weight: 700;
  }
  .score-badge span:first-child { font-weight: 500; color: var(--muted); font-size: .9rem; }
  .nav-section { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 8px 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 6px 8px; border: 0; border-radius: 7px; background: transparent;
    cursor: pointer; text-align: left; font-size: .88rem; color: var(--muted);
  }
  .nav-item:hover { background: var(--accent-soft); color: var(--text); }
  .nav-item.active { background: var(--accent-soft); color: var(--text); font-weight: 600; }
  .nav-item .num { min-width: 22px; font-variant-numeric: tabular-nums; }
  .nav-item .label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
  .dot.ok { background: var(--ok); }
  .dot.bad { background: var(--bad); }
  .nav-results { margin-top: 14px; width: 100%; }

  .main { flex: 1; min-width: 0; padding: 24px 28px 64px; }
  .main-inner { max-width: 760px; margin: 0 auto; }
  .quiz-desc { margin: 0 0 16px; }
  .progress-row { display: flex; align-items: center; gap: 12px; margin: 8px 0 20px; font-size: .88rem; color: var(--muted); }
  .progress { flex: 1; height: 8px; border-radius: 99px; background: var(--border); overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); border-radius: 99px; transition: width .25s; }

  .q-meta { display: flex; justify-content: space-between; gap: 12px; font-size: .82rem; color: var(--muted); margin-bottom: 10px; }
  .q-section { color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .q-text { font-size: 1.12rem; font-weight: 600; margin-bottom: 6px; }
  .q-text p:first-child { margin-top: 0; }
  .q-hint { font-size: .85rem; color: var(--muted); margin-bottom: 14px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .option {
    display: flex; align-items: flex-start; gap: 12px; width: 100%;
    padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--border);
    background: transparent; cursor: pointer; text-align: left; line-height: 1.45;
    transition: border-color .12s, background .12s;
  }
  .option:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .option:disabled { cursor: default; }
  .option .letter {
    display: inline-grid; place-items: center; flex-shrink: 0;
    width: 26px; height: 26px; border-radius: 7px;
    border: 1.5px solid var(--border); font-size: .8rem; font-weight: 700; color: var(--muted);
  }
  .option.multi .letter { border-radius: 5px; }
  .option .body { flex: 1; min-width: 0; padding-top: 1px; }
  .option .body > :first-child { margin-top: 0; }
  .option .body > :last-child { margin-bottom: 0; }
  .option.selected { border-color: var(--accent); background: var(--accent-soft); }
  .option.selected .letter { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .option.correct { border-color: var(--ok); background: var(--ok-bg); }
  .option.correct .letter { background: var(--ok); border-color: var(--ok); color: #fff; }
  .option.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .option.wrong .letter { background: var(--bad); border-color: var(--bad); color: #fff; }
  .option.missed { border-color: var(--ok); border-style: dashed; }
  .option.missed .letter { border-color: var(--ok); color: var(--ok); }
  .option .tag { font-size: .75rem; font-weight: 700; padding-top: 3px; white-space: nowrap; }
  .option.correct .tag, .option.missed .tag { color: var(--ok); }
  .option.wrong .tag { color: var(--bad); }

  .explanation { margin-top: 18px; padding: 14px 16px; border-radius: 10px; border-left: 4px solid; }
  .explanation.ok { background: var(--ok-bg); border-color: var(--ok); }
  .explanation.bad { background: var(--bad-bg); border-color: var(--bad); }
  .explanation .verdict { font-weight: 700; margin-bottom: 4px; }
  .explanation.ok .verdict { color: var(--ok); }
  .explanation.bad .verdict { color: var(--bad); }
  .explanation > div > :first-child { margin-top: 0; }
  .explanation > div > :last-child { margin-bottom: 0; }

  .actions { display: flex; gap: 10px; justify-content: space-between; margin-top: 20px; flex-wrap: wrap; }
  .actions .right { display: flex; gap: 10px; margin-left: auto; }
  .kbd-hint { margin-top: 14px; font-size: .78rem; color: var(--muted); text-align: center; }

  /* Results */
  .results { text-align: center; }
  .big-score { font-size: 3.4rem; font-weight: 800; line-height: 1.1; margin: 10px 0 4px; color: var(--accent); }
  .grade { font-size: 1.2rem; font-weight: 700; margin-bottom: 18px; }
  .stats { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 18px 0; }
  .stat { min-width: 110px; padding: 12px; border-radius: 10px; border: 1px solid var(--border); }
  .stat b { display: block; font-size: 1.5rem; }
  .stat.ok b { color: var(--ok); }
  .stat.bad b { color: var(--bad); }
  .review-list { text-align: left; margin: 20px 0 0; padding: 0; list-style: none; }
  .review-list li { margin: 6px 0; }
  .review-list button { border: 0; background: none; color: var(--accent); cursor: pointer; text-align: left; padding: 0; }
  .review-list button:hover { text-decoration: underline; }

  .error-box { border-left: 4px solid var(--bad); }
  .error-box pre { white-space: pre-wrap; }
  .loading { text-align: center; padding: 80px 16px; color: var(--muted); }

  @media (max-width: 760px) {
    .layout { flex-direction: column; }
    .sidebar {
      position: static; width: 100%; max-height: none;
      display: flex; align-items: center; gap: 6px; overflow-x: auto;
      padding: 10px 16px; border-right: 0; border-bottom: 1px solid var(--border);
    }
    .score-badge { margin: 0 6px 0 0; flex-shrink: 0; gap: 8px; }
    .nav-section, .nav-item .label { display: none; }
    .nav-item { width: auto; flex-shrink: 0; padding: 6px; }
    .nav-results { margin: 0; width: auto; flex-shrink: 0; padding: 6px 12px; }
    .main { padding: 20px 16px 48px; }
    .card { padding: 18px; }
    .kbd-hint { display: none; }
  }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="./" id="brand"><span class="brand-mark">?</span><span>Quiz</span></a>
  <span class="spacer"></span>
  <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark / light"></button>
</header>
<div id="app"></div>

<script>
(function () {
  'use strict';

  // ---------- Storage helpers (storage may be unavailable) ----------
  function getItem(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function setItem(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  // ---------- Theme ----------
  var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  var themeBtn = document.getElementById('theme-toggle');
  function paintThemeButton() {
    var dark = document.documentElement.dataset.theme === 'dark';
    themeBtn.innerHTML = dark ? SUN : MOON;
    themeBtn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
  }
  themeBtn.addEventListener('click', function () {
    var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    setItem('quiz-theme', next);
    paintThemeButton();
  });
  paintThemeButton();

  // ---------- DOM helpers ----------
  var app = document.getElementById('app');
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        var v = attrs[k];
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? '' : v);
      }
    }
    for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }
  function append(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { append(el, x); }); return; }
    el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }

  // ---------- HTML sanitizer (allow-list) ----------
  // Quiz content comes from arbitrary URLs, so we never inject it as raw HTML.
  // It is parsed in an inert document and rebuilt using only allowed tags;
  // all attributes are dropped except a safe href on links.
  var ALLOWED = ' B STRONG I EM U S DEL INS CODE PRE KBD SAMP VAR BR P UL OL LI A BLOCKQUOTE MARK SMALL SUB SUP SPAN DIV H3 H4 H5 H6 HR TABLE THEAD TBODY TR TH TD ';
  var DROP = ' SCRIPT STYLE IFRAME FRAME FRAMESET OBJECT EMBED TEMPLATE NOSCRIPT SVG MATH LINK META BASE TITLE HEAD FORM INPUT TEXTAREA SELECT BUTTON AUDIO VIDEO CANVAS ';
  function sanitize(html) {
    var doc = new DOMParser().parseFromString('<!doctype html><body>' + String(html == null ? '' : html), 'text/html');
    var frag = document.createDocumentFragment();
    (function walk(src, dst) {
      for (var n = src.firstChild; n; n = n.nextSibling) {
        if (n.nodeType === 3) { dst.appendChild(document.createTextNode(n.nodeValue)); continue; }
        if (n.nodeType !== 1) continue;
        var tag = n.tagName.toUpperCase();
        if (ALLOWED.indexOf(' ' + tag + ' ') !== -1) {
          var el = document.createElement(tag.toLowerCase());
          if (tag === 'A') {
            try {
              var u = new URL(n.getAttribute('href') || '', location.href);
              if (u.protocol === 'http:' || u.protocol === 'https:' || u.protocol === 'mailto:') {
                el.setAttribute('href', u.href);
                el.setAttribute('target', '_blank');
                el.setAttribute('rel', 'noopener noreferrer');
              }
            } catch (e) {}
          }
          walk(n, el);
          dst.appendChild(el);
        } else if (DROP.indexOf(' ' + tag + ' ') === -1) {
          walk(n, dst); // unknown tag: keep its contents, drop the tag
        }
      }
    })(doc.body, frag);
    return frag;
  }
  function rich(tag, cls, html) {
    var el = h(tag, { class: cls });
    el.appendChild(sanitize(html));
    return el;
  }
  function plain(html) {
    var d = document.createElement('div');
    d.appendChild(sanitize(html));
    return d.textContent.replace(/\s+/g, ' ').trim();
  }

  // ---------- Params ----------
  // Parameters live in the hash (#quiz=<url>&shuffle=1) so the query string is
  // left alone for hosts that use it themselves, e.g. gistpreview's ?<gist-id>.
  // A bare hash (#https://…/quiz.json) is taken as the quiz URL.
  // ?quiz= in the query string still works as a fallback.
  var PARAM_RE = /^(quiz|url|q|shuffle)=/;
  function readParams(str) {
    // Pieces that aren't one of our keys are glued back onto the previous value,
    // so an unencoded quiz URL with its own "&" survives.
    var raw = {}, last = null;
    str.split('&').forEach(function (part) {
      if (PARAM_RE.test(part)) {
        var i = part.indexOf('=');
        last = part.slice(0, i);
        raw[last] = part.slice(i + 1);
      } else if (last) {
        raw[last] += '&' + part;
      }
    });
    var out = {};
    for (var k in raw) out[k] = safeDecode(raw[k]);
    return out;
  }
  var hash = location.hash.replace(/^#/, '');
  var hashParams = PARAM_RE.test(hash) ? readParams(hash) : (hash ? { quiz: safeDecode(hash) } : {});
  var queryParams = readParams(location.search.replace(/^\?/, ''));
  function param(name) { return hashParams[name] != null ? hashParams[name] : queryParams[name]; }
  function safeDecode(s) { try { return decodeURIComponent(s); } catch (e) { return s; } }
  var source = param('quiz') || param('url') || param('q');
  var shuffleOn = /^(1|true|yes|on)$/i.test(param('shuffle') || '');

  // Home keeps the host's own query string but drops ours and the hash.
  var otherQuery = location.search.replace(/^\?/, '').split('&').filter(function (p) { return p && !PARAM_RE.test(p); }).join('&');
  var homeHref = location.pathname + (otherQuery ? '?' + otherQuery : '');
  document.getElementById('brand').setAttribute('href', homeHref);

  function quizHref(src) { return homeHref + '#quiz=' + encodeURIComponent(src); }
  // Changing only the hash doesn't reload the page, so do it ourselves.
  window.addEventListener('hashchange', function () { location.reload(); });

  // ---------- Home ----------
  var EXAMPLE = 'examples/quiz-app.json';
  var SAMPLE_JSON = JSON.stringify({
    title: 'My quiz',
    description: 'Optional intro shown above the questions.',
    questions: [
      {
        section: 'Basics',
        text: 'Which option is correct?',
        options: ['First', 'Second', 'Third', 'Fourth'],
        correct: 1,
        explanation: '<strong>Second</strong> is correct because…'
      },
      {
        section: 'Basics',
        text: 'Select <em>all</em> prime numbers.',
        options: ['2', '4', '5', '9'],
        correct: [0, 2],
        explanation: 'An array in <code>correct</code> makes it multiple-choice.'
      }
    ]
  }, null, 2);

  function renderHome(prefill) {
    document.title = 'Quiz';
    var input = h('input', {
      type: 'text', id: 'quiz-url', name: 'quiz',
      placeholder: 'https://example.com/my-quiz.json', autocomplete: 'off', spellcheck: 'false',
      'aria-label': 'Quiz JSON URL'
    });
    if (prefill) input.value = prefill;
    var form = h('form', { class: 'load-form', onsubmit: function (e) {
      e.preventDefault();
      var v = input.value.trim();
      if (v) location.href = quizHref(v);
      else input.focus();
    } }, input, h('button', { class: 'btn primary', type: 'submit' }, 'Load quiz'));

    var pre = h('pre');
    pre.appendChild(h('code', { text: SAMPLE_JSON }));

    app.replaceChildren(h('div', { class: 'wrap home' },
      h('section', { class: 'card' },
        h('h1', { text: 'Load a quiz' }),
        h('p', { class: 'muted', style: 'margin:0' },
          'Paste the URL of a quiz JSON file. It is loaded in your browser and your progress is saved locally.'),
        form,
        h('p', { style: 'margin:14px 0 0' }, 'New here? ',
          h('a', { href: quizHref(EXAMPLE) }, 'Try the example quiz'), ' (it is about this app).')
      ),
      h('section', { class: 'card' },
        h('h2', { text: 'How it works' }),
        h('ul', null,
          h('li', null, 'Open this page with ', h('code', { text: '#quiz=<url>' }),
            ' after the address (or just ', h('code', { text: '#<url>' }), '). Share that link to share the quiz.'),
          h('li', null, 'The URL can be absolute, or relative to this page (e.g. ', h('code', { text: EXAMPLE }), ').'),
          h('li', null, 'The server hosting the JSON must allow cross-origin requests (CORS). Raw GitHub files, raw gists and GitHub Pages all do.'),
          h('li', null, 'Use ', h('code', { text: '#quiz=<url>&shuffle=1' }), ' to shuffle questions and options.'),
          h('li', null, 'Keyboard: ', h('kbd', { text: 'A' }), '–', h('kbd', { text: 'Z' }), ' or ',
            h('kbd', { text: '1' }), '–', h('kbd', { text: '9' }), ' pick an option, ',
            h('kbd', { text: 'Enter' }), ' submits / goes next, ',
            h('kbd', { text: '←' }), ' ', h('kbd', { text: '→' }), ' navigate.')
        )
      ),
      h('section', { class: 'card' },
        h('h2', { text: 'Quiz file format' }),
        h('p', null, 'A JSON object with a ', h('code', { text: 'questions' }), ' array (a bare array of questions also works):'),
        pre,
        h('ul', null,
          h('li', null, h('code', { text: 'correct' }), ' is the zero-based index of the right option. Use an array of indexes for multiple-choice questions; the user must pick exactly those to score.'),
          h('li', null, h('code', { text: 'section' }), ', ', h('code', { text: 'explanation' }), ', ', h('code', { text: 'title' }), ' and ', h('code', { text: 'description' }), ' are optional.'),
          h('li', null, 'Text fields accept a safe subset of HTML: ',
            h('code', { text: '<strong> <em> <code> <pre> <ul> <ol> <li> <a> <br> <p> <blockquote> <table>' }),
            ' and a few more. Scripts, styles and attributes are stripped.')
        )
      )
    ));
    if (!prefill) input.focus();
  }

  // ---------- Loading & validation ----------
  function fail(msg) { var e = new Error(msg); e.quiz = true; throw e; }

  function normalize(data) {
    var meta = Array.isArray(data) ? {} : (data && typeof data === 'object' ? data : fail('The file must contain a JSON object or array.'));
    var list = Array.isArray(data) ? data : meta.questions;
    if (!Array.isArray(list)) fail('Missing "questions" array.');
    if (!list.length) fail('The quiz has no questions.');
    var errors = [];
    var questions = list.map(function (q, i) {
      var where = 'Question ' + (i + 1) + ': ';
      if (!q || typeof q !== 'object') { errors.push(where + 'must be an object.'); return null; }
      if (q.text == null || q.text === '') errors.push(where + 'missing "text".');
      if (!Array.isArray(q.options) || q.options.length < 2) { errors.push(where + '"options" must be an array with at least 2 entries.'); return null; }
      var multi = Array.isArray(q.correct);
      var correct = multi ? q.correct.slice() : [q.correct];
      var bad = !correct.length || correct.some(function (c) {
        return typeof c !== 'number' || c % 1 !== 0 || c < 0 || c >= q.options.length;
      });
      if (bad) { errors.push(where + '"correct" must be an option index (0–' + (q.options.length - 1) + ') or an array of them.'); return null; }
      correct = correct.filter(function (c, j) { return correct.indexOf(c) === j; }).sort(function (a, b) { return a - b; });
      return {
        section: q.section == null ? '' : String(q.section),
        text: String(q.text == null ? '' : q.text),
        options: q.options.map(function (o) { return String(o == null ? '' : o); }),
        correct: correct,
        multi: multi,
        explanation: q.explanation == null ? '' : String(q.explanation)
      };
    });
    if (errors.length) fail('The quiz file has problems:\n• ' + errors.slice(0, 12).join('\n• ') + (errors.length > 12 ? '\n…and ' + (errors.length - 12) + ' more.' : ''));
    return {
      title: meta.title ? String(meta.title) : '',
      description: meta.description ? String(meta.description) : '',
      questions: questions
    };
  }

  function hashString(s) {
    var x = 5381;
    for (var i = 0; i < s.length; i++) x = ((x << 5) + x + s.charCodeAt(i)) | 0;
    return (x >>> 0).toString(36);
  }

  function load(src) {
    var url;
    try { url = new URL(src, location.href); } catch (e) { return Promise.reject(Object.assign(new Error('"' + src + '" is not a valid URL.'), { quiz: true })); }
    return fetch(url.href, { cache: 'no-cache' }).then(function (res) {
      if (!res.ok) fail('The server answered HTTP ' + res.status + (res.statusText ? ' ' + res.statusText : '') + ' for\n' + url.href);
      return res.text();
    }, function () {
      fail('Could not download\n' + url.href + '\n\nThe address may be wrong, you may be offline, or the server does not allow cross-origin requests (CORS). ' +
        'For GitHub files use the "Raw" URL (raw.githubusercontent.com or gist.githubusercontent.com).');
    }).then(function (text) {
      var data;
      try { data = JSON.parse(text.replace(/^﻿/, '')); } catch (e) { fail('The file is not valid JSON: ' + e.message); }
      return { url: url.href, hash: hashString(text), quiz: normalize(data) };
    });
  }

  function renderError(err) {
    document.title = 'Quiz – error';
    var pre = h('pre', { text: err && err.quiz ? err.message : String(err && err.stack || err) });
    app.replaceChildren(h('div', { class: 'wrap' },
      h('section', { class: 'card error-box' },
        h('h1', { text: 'Could not load the quiz' }),
        pre,
        h('div', { class: 'actions' },
          h('a', { class: 'btn', href: homeHref }, '← Home'),
          h('button', { class: 'btn primary', type: 'button', onclick: function () { location.reload(); } }, 'Retry')
        )
      )
    ));
  }

  // ---------- Quiz ----------
  function shuffled(n) {
    var a = [];
    for (var i = 0; i < n; i++) a.push(i);
    if (shuffleOn) {
      for (var j = n - 1; j > 0; j--) {
        var k = Math.floor(Math.random() * (j + 1));
        var t = a[j]; a[j] = a[k]; a[k] = t;
      }
    }
    return a;
  }

  function startQuiz(loaded) {
    var quiz = loaded.quiz;
    var Q = quiz.questions;
    var N = Q.length;
    var storeKey = 'quiz-progress:' + loaded.url + (shuffleOn ? '#shuffle' : '');

    function freshState() {
      return {
        hash: loaded.hash,
        order: shuffled(N),
        opts: Q.map(function (q) { return shuffled(q.options.length); }),
        answers: {},   // question index -> sorted array of chosen option indexes
        pos: 0,
        view: 'question'
      };
    }
    var state = null;
    try {
      var saved = JSON.parse(getItem(storeKey) || 'null');
      if (saved && saved.hash === loaded.hash && Array.isArray(saved.order) && saved.order.length === N) state = saved;
    } catch (e) {}
    if (!state) state = freshState();
    var pending = []; // selections for an unsubmitted multiple-choice question

    function save() { setItem(storeKey, JSON.stringify(state)); }

    function isAnswered(qi) { return Object.prototype.hasOwnProperty.call(state.answers, qi); }
    function isCorrect(qi) {
      var a = state.answers[qi], c = Q[qi].correct;
      return !!a && a.length === c.length && a.every(function (x, i) { return x === c[i]; });
    }
    function counts() {
      var answered = 0, correct = 0;
      for (var i = 0; i < N; i++) if (isAnswered(i)) { answered++; if (isCorrect(i)) correct++; }
      return { answered: answered, correct: correct };
    }

    document.title = quiz.title || 'Quiz';

    var sidebar = h('aside', { class: 'sidebar', 'aria-label': 'Questions' });
    var main = h('section', { class: 'main' });
    app.replaceChildren(h('div', { class: 'layout' }, sidebar, main));

    function go(pos) {
      state.pos = Math.max(0, Math.min(N - 1, pos));
      state.view = 'question';
      pending = [];
      save();
      render();
      window.scrollTo(0, 0);
    }
    function showResults() {
      state.view = 'results';
      save();
      render();
      window.scrollTo(0, 0);
    }
    function restart() {
      state = freshState();
      pending = [];
      save();
      render();
      window.scrollTo(0, 0);
    }
    function answer(qi, chosen) {
      state.answers[qi] = chosen.slice().sort(function (a, b) { return a - b; });
      pending = [];
      save();
      render();
    }

    function renderSidebar() {
      var c = counts();
      var items = [h('div', { class: 'score-badge' }, h('span', { text: 'Score' }), h('span', { text: c.correct + ' / ' + N }))];
      var lastSection = null;
      state.order.forEach(function (qi, pos) {
        var q = Q[qi];
        if (q.section && q.section !== lastSection) items.push(h('div', { class: 'nav-section', text: q.section }));
        lastSection = q.section;
        var dotCls = 'dot' + (isAnswered(qi) ? (isCorrect(qi) ? ' ok' : ' bad') : '');
        var active = state.view === 'question' && pos === state.pos;
        items.push(h('button', {
          class: 'nav-item' + (active ? ' active' : ''), type: 'button',
          title: plain(q.text), 'aria-current': active ? 'step' : null,
          onclick: function () { go(pos); }
        }, h('span', { class: dotCls }), h('span', { class: 'num', text: String(pos + 1) }), h('span', { class: 'label', text: plain(q.text) })));
      });
      if (c.answered === N) {
        items.push(h('button', { class: 'btn primary nav-results', type: 'button', onclick: showResults }, 'Results'));
      }
      sidebar.replaceChildren.apply(sidebar, items);
      var act = sidebar.querySelector('.nav-item.active');
      if (act && act.scrollIntoView) act.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }

    function header() {
      var c = counts();
      var pct = Math.round(c.answered / N * 100);
      return [
        quiz.title ? h('h1', { text: quiz.title }) : null,
        quiz.description ? rich('div', 'quiz-desc muted', quiz.description) : null,
        h('div', { class: 'progress-row' },
          h('div', { class: 'progress', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': String(N), 'aria-valuenow': String(c.answered) },
            h('div', { style: 'width:' + pct + '%' })),
          h('span', { text: c.answered + ' / ' + N + ' answered' }))
      ];
    }

    function renderQuestion() {
      var pos = state.pos, qi = state.order[pos], q = Q[qi], perm = state.opts[qi];
      var answered = isAnswered(qi);
      var chosen = answered ? state.answers[qi] : pending;
      var correctNow = answered && isCorrect(qi);

      var opts = h('div', { class: 'options', role: q.multi ? 'group' : 'radiogroup' });
      perm.forEach(function (orig, d) {
        var picked = chosen.indexOf(orig) !== -1;
        var right = q.correct.indexOf(orig) !== -1;
        var cls = 'option' + (q.multi ? ' multi' : '');
        var tag = null;
        if (answered) {
          if (right && picked) { cls += ' correct'; tag = q.multi ? 'Correct' : null; }
          else if (right) { cls += q.multi ? ' missed' : ' correct'; tag = q.multi ? 'Missed' : 'Answer'; }
          else if (picked) { cls += ' wrong'; tag = 'Wrong'; }
        } else if (picked) cls += ' selected';
        opts.appendChild(h('button', {
          class: cls, type: 'button', disabled: answered,
          role: q.multi ? 'checkbox' : 'radio', 'aria-checked': picked ? 'true' : 'false',
          'data-orig': String(orig),
          onclick: function () { choose(orig); }
        },
          h('span', { class: 'letter', text: String.fromCharCode(65 + d) }),
          rich('span', 'body', q.options[orig]),
          tag ? h('span', { class: 'tag', text: tag }) : null
        ));
      });

      var feedback = null;
      if (answered) {
        var verdict = correctNow ? 'Correct!' : (q.multi && chosen.some(function (x) { return q.correct.indexOf(x) !== -1; }) ? 'Not quite — you need exactly the right options.' : 'Incorrect');
        feedback = h('div', { class: 'explanation ' + (correctNow ? 'ok' : 'bad'), role: 'status' },
          h('div', { class: 'verdict', text: verdict }),
          q.explanation ? rich('div', '', q.explanation) : null);
      }

      var c = counts();
      var isLast = pos === N - 1;
      var submit = q.multi && !answered
        ? h('button', { class: 'btn primary', type: 'button', disabled: !pending.length, onclick: submitPending }, 'Submit')
        : null;
      var next;
      if (c.answered === N && (isLast || answered)) {
        next = isLast
          ? h('button', { class: 'btn primary', type: 'button', onclick: showResults }, 'See results')
          : h('button', { class: 'btn primary', type: 'button', onclick: function () { go(pos + 1); } }, 'Next →');
      } else if (isLast) {
        var firstOpen = state.order.findIndex(function (x) { return !isAnswered(x); });
        next = h('button', { class: 'btn' + (answered ? ' primary' : ''), type: 'button', disabled: firstOpen === pos || firstOpen < 0, onclick: function () { go(firstOpen); } }, 'Next unanswered');
      } else {
        next = h('button', { class: 'btn' + (answered ? ' primary' : ''), type: 'button', onclick: function () { go(pos + 1); } }, answered ? 'Next →' : 'Skip →');
      }

      main.replaceChildren(h('div', { class: 'main-inner' },
        header(),
        h('article', { class: 'card' },
          h('div', { class: 'q-meta' },
            h('span', { class: 'q-section', text: q.section || '' }),
            h('span', { text: 'Question ' + (pos + 1) + ' of ' + N })),
          rich('div', 'q-text', q.text),
          q.multi ? h('div', { class: 'q-hint', text: 'Select all that apply (' + q.correct.length + ' correct), then submit.' }) : null,
          opts,
          feedback,
          h('div', { class: 'actions' },
            h('button', { class: 'btn', type: 'button', disabled: pos === 0, onclick: function () { go(pos - 1); } }, '← Previous'),
            h('div', { class: 'right' }, submit, next))
        ),
        h('div', { class: 'kbd-hint' }, 'Tip: press ', h('kbd', { text: 'A' }), '–', h('kbd', { text: String.fromCharCode(64 + Math.min(perm.length, 26)) }),
          ' to choose, ', h('kbd', { text: 'Enter' }), ' to ', q.multi ? 'submit / continue' : 'continue', ', ', h('kbd', { text: '←' }), h('kbd', { text: '→' }), ' to navigate.')
      ));
    }

    function choose(orig) {
      var qi = state.order[state.pos], q = Q[qi];
      if (isAnswered(qi)) return;
      if (!q.multi) { answer(qi, [orig]); return; }
      var i = pending.indexOf(orig);
      if (i === -1) pending.push(orig); else pending.splice(i, 1);
      render();
    }
    function submitPending() {
      var qi = state.order[state.pos];
      if (pending.length && !isAnswered(qi)) answer(qi, pending);
    }

    function renderResults() {
      var c = counts();
      var pct = Math.round(c.correct / N * 100);
      var grade = pct >= 90 ? 'Outstanding 🏆' : pct >= 75 ? 'Great job 🎉' : pct >= 60 ? 'Good 👍' : pct >= 40 ? 'Keep practicing 📚' : 'Time to review 🔁';
      var missed = [];
      state.order.forEach(function (qi, pos) {
        if (!isCorrect(qi)) missed.push(h('li', null, h('button', { type: 'button', onclick: function () { go(pos); } },
          (pos + 1) + '. ' + plain(Q[qi].text))));
      });
      main.replaceChildren(h('div', { class: 'main-inner' },
        header(),
        h('article', { class: 'card results' },
          h('div', { class: 'muted', text: 'Your score' }),
          h('div', { class: 'big-score', text: pct + '%' }),
          h('div', { class: 'grade', text: grade }),
          h('div', { class: 'stats' },
            h('div', { class: 'stat ok' }, h('b', { text: String(c.correct) }), 'Correct'),
            h('div', { class: 'stat bad' }, h('b', { text: String(c.answered - c.correct) }), 'Wrong'),
            N - c.answered ? h('div', { class: 'stat' }, h('b', { text: String(N - c.answered) }), 'Unanswered') : null,
            h('div', { class: 'stat' }, h('b', { text: String(N) }), 'Total')),
          missed.length ? h('div', null, h('h2', { text: 'Review these', style: 'margin-top:24px' }), h('ul', { class: 'review-list' }, missed)) : null,
          h('div', { class: 'actions', style: 'justify-content:center' },
            h('button', { class: 'btn', type: 'button', onclick: function () { go(0); } }, 'Review answers'),
            h('button', { class: 'btn primary', type: 'button', onclick: restart }, 'Restart quiz'),
            h('a', { class: 'btn', href: homeHref }, 'Load another quiz'))
        )
      ));
    }

    function render() {
      renderSidebar();
      if (state.view === 'results') renderResults(); else renderQuestion();
    }

    document.addEventListener('keydown', function (e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      var t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      if (state.view !== 'question') return;
      var qi = state.order[state.pos], perm = state.opts[qi];
      var k = e.key;
      var d = -1;
      if (/^[1-9]$/.test(k)) d = +k - 1;
      else if (/^[a-z]$/i.test(k)) d = k.toUpperCase().charCodeAt(0) - 65;
      if (d >= 0) {
        if (d < perm.length) { e.preventDefault(); choose(perm[d]); }
        return;
      }
      if (k === 'ArrowRight' && state.pos < N - 1) { e.preventDefault(); go(state.pos + 1); }
      else if (k === 'ArrowLeft' && state.pos > 0) { e.preventDefault(); go(state.pos - 1); }
      else if (k === 'Enter') {
        if (t && t.tagName === 'BUTTON') return; // let the focused button handle it
        e.preventDefault();
        if (Q[qi].multi && !isAnswered(qi)) { submitPending(); return; }
        if (!isAnswered(qi)) return;
        var c = counts();
        if (c.answered === N && state.pos === N - 1) showResults();
        else if (state.pos < N - 1) go(state.pos + 1);
        else {
          var open = state.order.findIndex(function (x) { return !isAnswered(x); });
          if (open >= 0) go(open);
        }
      }
    });

    render();
  }

  // ---------- Boot ----------
  if (!source) {
    renderHome();
  } else {
    app.replaceChildren(h('div', { class: 'loading', text: 'Loading quiz…' }));
    load(source).then(startQuiz).catch(renderError);
  }
})();
</script>
</body>
</html>
